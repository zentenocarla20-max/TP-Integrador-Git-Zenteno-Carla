<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculadora">

        <div class="pantalla">
            <span>0</span>
        </div>

        <div class="botones">

            <button class="funcion">AC</button>
            <button class="funcion">+/-</button>
            <button class="funcion">%</button>
            <button class="operador">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operador">×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operador">−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operador">+</button>

            <button class="cero">0</button>
            <button>.</button>
            <button class="igual">=</button>

        </div>

    </main>

</body>
</html>
